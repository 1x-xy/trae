# Render.com 部署配置（免费套餐，Blueprint 一键部署）
# 使用方法：Render 控制台 New -> Blueprint -> 选择本仓库 -> Apply
# 数据库、后端、环境变量全部自动创建，无需手动填写
databases:
  - name: item-approval-db
    plan: free
    databaseName: item_approval
    user: app_user

services:
  - type: web
    name: item-approval-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_TYPE
        value: postgres
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: item-approval-db
          property: connectionString
